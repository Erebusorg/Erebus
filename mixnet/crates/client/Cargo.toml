[package]
name = "erebus-client"
description = "Erebus client: path selection, reply blocks, cover traffic, and a demo sink."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "erebus-client"
path = "src/main.rs"

[dependencies]
erebus-chain.workspace = true
erebus-envelope.workspace = true
erebus-sphinx.workspace = true
erebus-topology.workspace = true
erebus-wire.workspace = true

anyhow.workspace = true
clap.workspace = true
rand.workspace = true
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
erebus-node = { path = "../node" }
rand_chacha.workspace = true
