[package]
name = "erebus-chain"
description = "Reads the Erebus node set from the on-chain registry."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "erebus-registry"
path = "src/main.rs"

[dependencies]
erebus-topology.workspace = true

alloy-primitives = "1.3.0"
alloy-sol-types = "1.3.0"
anyhow.workspace = true
clap.workspace = true
reqwest = { version = "0.12.12", default-features = false, features = ["rustls-tls", "json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
