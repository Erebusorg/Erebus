[package]
name = "erebus-gateway"
description = "Erebus gateway: carries packets between a browser and the mixnet without being able to read them."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "erebus-gateway"
path = "src/main.rs"

[dependencies]
erebus-envelope.workspace = true
erebus-sdk = { path = "../sdk" }
erebus-sphinx.workspace = true
erebus-topology.workspace = true
erebus-wire.workspace = true

anyhow.workspace = true
clap.workspace = true
futures-util = { version = "0.3.31", default-features = false, features = ["sink"] }
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite = "0.24.0"
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
erebus-client = { path = "../client" }
erebus-node = { path = "../node" }
rand.workspace = true
tokio-tungstenite = "0.24.0"
