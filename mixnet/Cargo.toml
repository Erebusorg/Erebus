[workspace]
resolver = "2"
members = [
    "crates/sphinx",
    "crates/topology",
    "crates/envelope",
    "crates/wire",
    "crates/node",
    "crates/client",
    "crates/sdk",
    "crates/gateway",
    "crates/chain",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AlexKarys/erebus"

[workspace.dependencies]
erebus-chain = { path = "crates/chain" }
erebus-envelope = { path = "crates/envelope" }
erebus-sphinx = { path = "crates/sphinx" }
erebus-topology = { path = "crates/topology" }
erebus-wire = { path = "crates/wire" }

anyhow = "1.0.95"
chacha20 = "0.9.1"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5.23", features = ["derive"] }
hmac = "0.12.1"
rand = "0.8.5"
rand_chacha = "0.3.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
sha2 = "0.10.8"
thiserror = "2.0.9"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
